[project]
name = "clausecheck"
version = "0.1.0"
description = "Triage one contract clause with an LLM and return grounded risk issues."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "langsmith>=0.16.0",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # langsmith uses asyncio.iscoroutinefunction, deprecated in Python 3.15 (third-party code).
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
